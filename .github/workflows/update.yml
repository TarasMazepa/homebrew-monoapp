name: update.yml
on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        type: string
      version:
        required: false
        type: string

env:
  TAG: ${{ inputs.tag }}
  VERSION: ${{ inputs.version }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}
      - run: |
          git config --global user.name 'monoapp'
          git config --global user.email 'monoapp@themonoapp.com'
      - if: "${{ github.event.inputs.tag != '' }}"
        run: |
          sed "s/version '.*/version '$VERSION'/" ./mna.rb > ./mna.rb.tmp && mv ./mna.rb.tmp ./mna.rb
          update_checksum () {
            checksum=$(curl -sL "https://github.com/TarasMazepa/homebrew-monoapp/releases/download/$TAG/$1.zip" | shasum -a 256 | awk '{print $1}')
            sed "s+sha256.*$1+sha256 '$checksum' # $1+" ./mna.rb > ./mna.rb.tmp && mv ./mna.rb.tmp ./mna.rb
          }
          update_checksum "macos-arm"
          update_checksum "linux-x64"
          cp ./mna.rb "./mna@$VERSION.rb"
          CLEAN_TAG="$(echo "$VERSION" | sed 's/[^a-zA-Z0-9]//g')"
          sed "s/class Mna < Formula/class MnaAT$CLEAN_TAG < Formula/" "./mna@$VERSION.rb" > "./mna@$VERSION.rb.tmp" && mv "./mna@$VERSION.rb.tmp" "./mna@$VERSION.rb"
          git add .
          branch_name=update-mna-to-$VERSION-$(date -u +"%Y-%m-%dT%H-%M-%S")
          git checkout -b $branch_name
          git commit -m "Update mna to $VERSION"
          git push --set-upstream origin $branch_name
          gh pr merge $(gh pr create -B main -f) --auto --squash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
